<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NestFind — Property</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Sora',sans-serif; background:#f0ede8; min-height:100vh; color:#1a1a2e; }

    nav { background:#fff; padding:0 40px; height:64px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 12px rgba(0,0,0,0.06); position:sticky; top:0; z-index:100; }
    .logo { font-size:1.5rem; font-weight:700; color:#1a1a2e; text-decoration:none; }
    .logo span { color:#c9a84c; }
    .nav-links { display:flex; align-items:center; gap:28px; }
    .nav-links a { text-decoration:none; font-size:0.88rem; font-weight:500; color:#666; transition:color 0.2s; }
    .nav-links a:hover { color:#c9a84c; }
    .btn-post { background:#1a1a2e; color:#fff; border:none; padding:9px 20px; border-radius:8px; font-family:'Sora',sans-serif; font-size:0.85rem; font-weight:600; cursor:pointer; transition:background 0.2s; }
    .btn-post:hover { background:#c9a84c; }
    .nav-avatar { width:36px; height:36px; background:#f0ede8; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1rem; cursor:pointer; border:2px solid #e0dbd2; font-weight:700; }

    /* ── LAYOUT ── */
    .page { max-width:1100px; margin:0 auto; padding:32px 24px 60px; }

    .breadcrumb { font-size:0.78rem; color:#aaa; margin-bottom:20px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .breadcrumb a { color:#c9a84c; text-decoration:none; }
    .breadcrumb a:hover { text-decoration:underline; }

    .two-col-layout { display:grid; grid-template-columns:1fr 360px; gap:24px; align-items:start; }
    @media (max-width:900px) { .two-col-layout { grid-template-columns:1fr; } }

    /* ── GALLERY ── */
    .gallery { background:#fff; border-radius:20px; overflow:hidden; margin-bottom:20px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
    .gallery-main { position:relative; height:380px; background:#1a1a2e; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .gallery-main img { width:100%; height:100%; object-fit:cover; }
    .gallery-placeholder { font-size:5rem; opacity:0.3; }
    .gallery-badge { position:absolute; top:16px; left:16px; padding:5px 12px; border-radius:8px; font-size:0.78rem; font-weight:700; }
    .badge-sale { background:#fff8ec; color:#c9a84c; }
    .badge-rent { background:#eef8f0; color:#27a854; }
    .badge-pg   { background:#eef3ff; color:#4a6cf7; }
    .gallery-count { position:absolute; bottom:14px; right:14px; background:rgba(0,0,0,0.55); color:#fff; font-size:0.75rem; padding:4px 10px; border-radius:6px; font-weight:600; }
    .gallery-nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.9); border:none; width:36px; height:36px; border-radius:50%; font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.2s; }
    .gallery-nav:hover { background:#c9a84c; color:#fff; }
    .gallery-nav.prev { left:14px; }
    .gallery-nav.next { right:14px; }
    .gallery-thumbs { display:flex; gap:8px; padding:12px; overflow-x:auto; }
    .gallery-thumbs::-webkit-scrollbar { height:4px; }
    .gallery-thumbs::-webkit-scrollbar-thumb { background:#e0dbd2; border-radius:2px; }
    .thumb { width:72px; height:56px; border-radius:8px; object-fit:cover; cursor:pointer; opacity:0.6; border:2px solid transparent; transition:all 0.2s; flex-shrink:0; }
    .thumb.active { opacity:1; border-color:#c9a84c; }

    /* ── DETAILS CARD ── */
    .detail-card { background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); margin-bottom:20px; }
    .prop-title { font-size:1.4rem; font-weight:700; color:#1a1a2e; margin-bottom:8px; line-height:1.3; }
    .prop-loc { font-size:0.87rem; color:#888; margin-bottom:16px; display:flex; align-items:center; gap:6px; }
    .prop-price-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    .prop-price { font-size:1.8rem; font-weight:700; color:#c9a84c; }
    .prop-price-sub { font-size:0.75rem; color:#bbb; margin-top:2px; }
    .prop-actions { display:flex; gap:10px; }
    .btn-share { background:transparent; border:1.5px solid #e0dbd2; padding:9px 18px; border-radius:8px; font-family:'Sora',sans-serif; font-size:0.82rem; font-weight:600; color:#666; cursor:pointer; transition:all 0.2s; }
    .btn-share:hover { border-color:#c9a84c; color:#c9a84c; }

    .spec-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:20px 0; border-top:1px solid #f5f2ee; border-bottom:1px solid #f5f2ee; margin:20px 0; }
    .spec-item { text-align:center; }
    .spec-icon { font-size:1.3rem; margin-bottom:4px; }
    .spec-val { font-size:0.92rem; font-weight:700; color:#1a1a2e; }
    .spec-label { font-size:0.72rem; color:#aaa; margin-top:1px; }

    .section-title { font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:#bbb; margin-bottom:12px; }
    .prop-desc { font-size:0.87rem; color:#555; line-height:1.75; }

    /* ── FEATURES ── */
    .features-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px; }
    .feat { display:flex; align-items:center; gap:8px; font-size:0.82rem; color:#555; }
    .feat-dot { width:6px; height:6px; background:#c9a84c; border-radius:50%; flex-shrink:0; }

    /* ── STICKY SIDEBAR ── */
    .sidebar { position:sticky; top:80px; }

    /* ── SELLER CARD ── */
    .seller-card { background:#fff; border-radius:20px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); margin-bottom:16px; }
    .seller-header { display:flex; align-items:center; gap:14px; margin-bottom:20px; }
    .seller-avatar { width:52px; height:52px; background:linear-gradient(135deg,#c9a84c,#b8923e); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.4rem; font-weight:700; color:#fff; flex-shrink:0; }
    .seller-name { font-size:0.97rem; font-weight:700; color:#1a1a2e; }
    .seller-role { font-size:0.75rem; color:#aaa; margin-top:2px; }
    .seller-verified { display:inline-flex; align-items:center; gap:4px; font-size:0.72rem; color:#27a854; background:#eef8f0; padding:3px 8px; border-radius:6px; margin-top:4px; font-weight:600; }

    .btn-call { width:100%; padding:13px; background:#1a1a2e; color:#fff; border:none; border-radius:10px; font-family:'Sora',sans-serif; font-size:0.92rem; font-weight:600; cursor:pointer; transition:background 0.2s; margin-bottom:10px; display:flex; align-items:center; justify-content:center; gap:8px; }
    .btn-call:hover { background:#c9a84c; }
    .btn-enquire { width:100%; padding:12px; background:transparent; border:1.5px solid #1a1a2e; color:#1a1a2e; border-radius:10px; font-family:'Sora',sans-serif; font-size:0.92rem; font-weight:600; cursor:pointer; transition:all 0.2s; display:flex; align-items:center; justify-content:center; gap:8px; }
    .btn-enquire:hover { background:#1a1a2e; color:#fff; }

    /* ── ENQUIRY FORM ── */
    .enquiry-form { margin-top:20px; border-top:1px solid #f5f2ee; padding-top:20px; display:none; }
    .enquiry-form.open { display:block; }
    .enq-title { font-size:0.82rem; font-weight:700; color:#1a1a2e; margin-bottom:14px; }
    .enq-field { margin-bottom:12px; }
    .enq-field input, .enq-field textarea {
      width:100%; padding:10px 14px; border:1.5px solid #ece8e0; border-radius:10px;
      font-family:'Sora',sans-serif; font-size:0.85rem; color:#1a1a2e; background:#faf9f7;
      outline:none; transition:border-color 0.2s;
    }
    .enq-field textarea { height:80px; resize:none; }
    .enq-field input:focus, .enq-field textarea:focus { border-color:#c9a84c; background:#fff; }
    .btn-send { width:100%; padding:11px; background:#c9a84c; color:#fff; border:none; border-radius:10px; font-family:'Sora',sans-serif; font-size:0.88rem; font-weight:600; cursor:pointer; transition:background 0.2s; }
    .btn-send:hover { background:#b8923e; }
    .enq-success { text-align:center; padding:16px; background:#eef8f0; border-radius:10px; }
    .enq-success p { color:#27a854; font-size:0.87rem; font-weight:600; }

    /* ── NOT FOUND ── */
    .not-found { text-align:center; padding:80px 20px; }
    .not-found h2 { font-size:1.4rem; font-weight:700; margin-bottom:12px; }
    .not-found p { color:#aaa; font-size:0.87rem; margin-bottom:24px; }

    /* ── SIMILAR ── */
    .similar-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:16px; }
    @media (max-width:700px) { .similar-grid { grid-template-columns:1fr 1fr; } }
    .sim-card { background:#fff; border-radius:14px; overflow:hidden; cursor:pointer; transition:transform 0.2s, box-shadow 0.2s; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
    .sim-card:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,0.1); }
    .sim-img { height:120px; background:#1a1a2e; display:flex; align-items:center; justify-content:center; font-size:2.2rem; overflow:hidden; }
    .sim-img img { width:100%; height:100%; object-fit:cover; }
    .sim-body { padding:12px; }
    .sim-title { font-size:0.82rem; font-weight:700; color:#1a1a2e; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sim-price { font-size:0.82rem; font-weight:700; color:#c9a84c; margin-top:4px; }
    .sim-loc { font-size:0.72rem; color:#bbb; }

    footer { background:#1a1a2e; color:rgba(255,255,255,0.5); text-align:center; padding:24px; font-size:0.8rem; }
    footer span { color:#c9a84c; }
    @media (max-width:600px) { nav { padding:0 20px; } .spec-grid { grid-template-columns:repeat(2,1fr); } .prop-title { font-size:1.15rem; } }
  </style>
</head>
<body>
  <nav>
    <a href="home.html" class="logo">Nest<span>Find</span></a>
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="#">Buy</a>
      <a href="#">Rent</a>
      <a href="#">Sell</a>
      <button class="btn-post" onclick="window.location.href='post-property.html'">+ Post Property</button>
      <div class="nav-avatar" id="nav-av">👤</div>
    </div>
  </nav>

  <div class="page" id="page-content">
    <!-- rendered by JS -->
  </div>

  <footer><p>© 2025 <span>NestFind</span> — Buy, Sell &amp; Rent Properties with Ease</p></footer>

  <script src="auth.js"></script>
  <script>
    NF.updateNav();

    const params = new URLSearchParams(location.search);
    const propId = params.get('id');
    const props  = NF.getProperties();
    const prop   = props.find(p => p.id === propId);
    const page   = document.getElementById('page-content');

    /* ── NOT FOUND ── */
    if (!prop) {
      page.innerHTML = `
        <div class="not-found">
          <div style="font-size:3rem;margin-bottom:16px;">🏚️</div>
          <h2>Property not found</h2>
          <p>This listing may have been removed or the link is incorrect.</p>
          <button onclick="window.location.href='home.html'" style="padding:11px 28px;background:#1a1a2e;color:#fff;border:none;border-radius:10px;font-family:'Sora',sans-serif;font-size:0.9rem;font-weight:600;cursor:pointer;">← Back to Home</button>
        </div>`;
      throw new Error('Not found');
    }

    /* ── HELPERS ── */
    function fmtPrice(p) {
      if (p >= 10000000) return '₹' + (p/10000000).toFixed(2).replace(/\.?0+$/,'') + ' Cr';
      if (p >= 100000)   return '₹' + (p/100000).toFixed(2).replace(/\.?0+$/,'') + ' L';
      return '₹' + p.toLocaleString('en-IN');
    }
    function fmtDate(ts) {
      return new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
    }
    const badgeCls = {Sale:'badge-sale',Rent:'badge-rent',PG:'badge-pg'}[prop.listingType]||'badge-sale';
    const badgeTxt = {Sale:'For Sale',Rent:'For Rent',PG:'PG / Hostel'}[prop.listingType]||prop.listingType;
    const typeIcon = {Apartment:'🏢',Villa:'🏖️',Plot:'🏗️',Commercial:'🏬','PG / Hostel':'🛏️'}[prop.type]||'🏠';

    /* ── PHOTOS ── */
    const photos = prop.photos && prop.photos.length ? prop.photos : [];
    let currentPhoto = 0;

    function galleryHTML() {
      if (!photos.length) {
        return `<div class="gallery-main">
          <div class="gallery-placeholder">${typeIcon}</div>
          <span class="gallery-badge ${badgeCls}">${badgeTxt}</span>
        </div>`;
      }
      return `
        <div class="gallery-main" id="gm">
          <img id="main-photo" src="${photos[0]}" alt="Property photo" />
          <span class="gallery-badge ${badgeCls}">${badgeTxt}</span>
          <span class="gallery-count" id="gc">1 / ${photos.length}</span>
          ${photos.length>1?`
          <button class="gallery-nav prev" onclick="slidePhoto(-1)">‹</button>
          <button class="gallery-nav next" onclick="slidePhoto(1)">›</button>`:''}
        </div>
        ${photos.length>1?`<div class="gallery-thumbs">
          ${photos.map((src,i)=>`<img class="thumb${i===0?' active':''}" src="${src}" onclick="goPhoto(${i})" alt="thumb ${i+1}" />`).join('')}
        </div>`:''}`;
    }

    function slidePhoto(dir) {
      goPhoto((currentPhoto + dir + photos.length) % photos.length);
    }
    function goPhoto(idx) {
      currentPhoto = idx;
      document.getElementById('main-photo').src = photos[idx];
      document.getElementById('gc').textContent = (idx+1) + ' / ' + photos.length;
      document.querySelectorAll('.thumb').forEach((t,i) => t.classList.toggle('active', i===idx));
    }

    /* ── SIMILAR LISTINGS ── */
    const similar = props.filter(p => p.id !== prop.id && (p.city === prop.city || p.type === prop.type)).slice(0,3);
    function simCardHTML(p) {
      const si = {Apartment:'🏢',Villa:'🏖️',Plot:'🏗️',Commercial:'🏬','PG / Hostel':'🛏️'}[p.type]||'🏠';
      const imgHTML = p.photos && p.photos[0]
        ? `<img src="${p.photos[0]}" alt="sim" />`
        : si;
      return `<div class="sim-card" onclick="window.location.href='property.html?id=${p.id}'">
        <div class="sim-img">${imgHTML}</div>
        <div class="sim-body">
          <div class="sim-title">${p.title}</div>
          <div class="sim-price">${fmtPrice(p.price)}</div>
          <div class="sim-loc">📍 ${p.city}</div>
        </div>
      </div>`;
    }

    /* ── RENDER ── */
    const sellerInitial = (prop.ownerName||'S').charAt(0).toUpperCase();
    const contactPhone = prop.contactPhone || prop.ownerPhone || '';
    const contactName  = prop.contactName  || prop.ownerName  || 'Seller';

    page.innerHTML = `
      <div class="breadcrumb">
        <a href="home.html">Home</a> › <a href="search.html">Properties</a> › ${prop.city} › <span>${prop.title}</span>
      </div>

      <div class="two-col-layout">

        <!-- LEFT -->
        <div>
          <!-- GALLERY -->
          <div class="gallery">${galleryHTML()}</div>

          <!-- DETAILS -->
          <div class="detail-card">
            <div class="prop-title">${prop.title}</div>
            <div class="prop-loc">📍 ${[prop.locality,prop.city].filter(Boolean).join(', ')} &nbsp;·&nbsp; Listed on ${fmtDate(prop.postedAt)}</div>
            <div class="prop-price-row">
              <div>
                <div class="prop-price">${fmtPrice(prop.price)}</div>
                <div class="prop-price-sub">${prop.listingType === 'Rent' ? 'per month' : 'total price'}</div>
              </div>
              <div class="prop-actions">
                <button class="btn-share" onclick="shareProperty()">🔗 Share</button>
              </div>
            </div>

            <div class="spec-grid">
              <div class="spec-item">
                <div class="spec-icon">🏢</div>
                <div class="spec-val">${prop.type || '—'}</div>
                <div class="spec-label">Type</div>
              </div>
              <div class="spec-item">
                <div class="spec-icon">🛏️</div>
                <div class="spec-val">${prop.bhk || '—'}</div>
                <div class="spec-label">BHK</div>
              </div>
              <div class="spec-item">
                <div class="spec-icon">📐</div>
                <div class="spec-val">${prop.area ? prop.area + ' sq ft' : '—'}</div>
                <div class="spec-label">Area</div>
              </div>
            </div>

            ${prop.description ? `
            <div class="section-title" style="margin-top:16px;">Description</div>
            <div class="prop-desc">${prop.description.replace(/\n/g,'<br/>')}</div>
            ` : ''}
          </div>

          ${similar.length ? `
          <div class="detail-card">
            <div class="section-title">Similar Properties</div>
            <div class="similar-grid">${similar.map(simCardHTML).join('')}</div>
          </div>` : ''}
        </div>

        <!-- SIDEBAR -->
        <div class="sidebar">
          <div class="seller-card">
            <div class="seller-header">
              <div class="seller-avatar">${sellerInitial}</div>
              <div>
                <div class="seller-name">${contactName}</div>
                <div class="seller-role">${prop.ownerEmail ? prop.ownerEmail : 'Property Owner'}</div>
                <div class="seller-verified">✔ Verified Seller</div>
              </div>
            </div>

            ${contactPhone ? `
            <button class="btn-call" onclick="window.location.href='tel:${contactPhone}'">
              📞 Call ${contactPhone}
            </button>` : ''}

            <button class="btn-enquire" onclick="toggleEnquiry()">
              ✉️ Send Enquiry
            </button>

            <!-- ENQUIRY FORM -->
            <div class="enquiry-form" id="enq-form">
              <div class="enq-title">Send a message to the seller</div>
              <div id="enq-fields">
                <div class="enq-field"><input type="text" id="enq-name" placeholder="Your name *" /></div>
                <div class="enq-field"><input type="tel" id="enq-phone" placeholder="Your phone *" /></div>
                <div class="enq-field"><input type="email" id="enq-email" placeholder="Your email (optional)" /></div>
                <div class="enq-field"><textarea id="enq-msg" placeholder="Hi, I'm interested in this property. Please contact me.">Hi, I'm interested in this property. Please contact me.</textarea></div>
                <div style="font-size:0.72rem;color:#e05656;margin-bottom:8px;display:none" id="enq-err"></div>
                <button class="btn-send" onclick="submitEnquiry()">Send Message →</button>
              </div>
              <div class="enq-success" id="enq-success" style="display:none">
                <div style="font-size:1.8rem;margin-bottom:8px;">✅</div>
                <p>Message sent successfully!</p>
                <p style="color:#aaa;font-size:0.75rem;margin-top:4px;">The seller will contact you soon.</p>
              </div>
            </div>
          </div>

          <!-- QUICK FACTS -->
          <div class="detail-card" style="padding:18px 20px;">
            <div class="section-title">Quick Facts</div>
            <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px;">
              <div style="display:flex;justify-content:space-between;font-size:0.82rem;">
                <span style="color:#aaa;">Listing ID</span>
                <span style="font-weight:600;color:#555;">${prop.id.slice(0,10).toUpperCase()}</span>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:0.82rem;">
                <span style="color:#aaa;">Listing Type</span>
                <span style="font-weight:600;color:#555;">${prop.listingType}</span>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:0.82rem;">
                <span style="color:#aaa;">Posted</span>
                <span style="font-weight:600;color:#555;">${fmtDate(prop.postedAt)}</span>
              </div>
              ${prop.area ? `<div style="display:flex;justify-content:space-between;font-size:0.82rem;">
                <span style="color:#aaa;">Price per sq ft</span>
                <span style="font-weight:600;color:#555;">₹${Math.round(prop.price/Number(prop.area)).toLocaleString('en-IN')}</span>
              </div>` : ''}
            </div>
          </div>
        </div>
      </div>`;

    /* ── ACTIONS ── */
    function toggleEnquiry() {
      const f = document.getElementById('enq-form');
      f.classList.toggle('open');
    }

    function submitEnquiry() {
      const name  = document.getElementById('enq-name').value.trim();
      const phone = document.getElementById('enq-phone').value.trim();
      const email = document.getElementById('enq-email').value.trim();
      const msg   = document.getElementById('enq-msg').value.trim();
      const errEl = document.getElementById('enq-err');

      if (!name || phone.replace(/\D/g,'').length < 10) {
        errEl.style.display = 'block';
        errEl.textContent = !name ? 'Please enter your name.' : 'Please enter a valid phone number.';
        return;
      }
      errEl.style.display = 'none';

      NF.sendEnquiry({ propertyId: prop.id, name, phone, email, message: msg });
      document.getElementById('enq-fields').style.display  = 'none';
      document.getElementById('enq-success').style.display = 'block';
    }

    function shareProperty() {
      const url = location.href;
      if (navigator.share) navigator.share({ title: prop.title, url });
      else {
        navigator.clipboard?.writeText(url);
        alert('Link copied to clipboard!');
      }
    }
  </script>
</body>
</html>
