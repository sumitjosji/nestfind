<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rent Property — NestFind</title>
  <style>
    .hero{background:linear-gradient(135deg,#0b3d2e 0%,#1a5c42 60%,#1a7a3e 100%);padding:56px 40px 44px;text-align:center;position:relative;overflow:hidden;}
    .hero::before{content:'🔑';position:absolute;font-size:20rem;opacity:0.04;right:-40px;top:-60px;line-height:1;pointer-events:none;}
    .hero-badge{display:inline-block;background:rgba(39,168,84,0.15);border:1px solid rgba(39,168,84,0.4);color:#5dd98a;font-size:0.78rem;font-weight:600;padding:5px 16px;border-radius:20px;margin-bottom:16px;letter-spacing:.05em;}
    .hero h1{font-size:2.4rem;font-weight:700;color:#fff;margin-bottom:10px;line-height:1.2;}
    .hero h1 span{color:#5dd98a;}
    .hero p{font-size:0.92rem;color:rgba(255,255,255,0.5);margin-bottom:32px;}
    .sbar{background:#fff;border-radius:14px;padding:8px;display:flex;align-items:center;gap:8px;max-width:760px;margin:0 auto 24px;box-shadow:0 4px 28px rgba(0,0,0,0.3);flex-wrap:wrap;}
    .sbar input{flex:1;min-width:160px;border:none;outline:none;font-family:'Sora',sans-serif;font-size:0.9rem;color:#1a1a2e;padding:8px 12px;background:transparent;}
    .sbar select{border:none;outline:none;font-family:'Sora',sans-serif;font-size:0.85rem;color:#666;background:#f0ede8;border-radius:8px;padding:8px 10px;cursor:pointer;}
    .btn-s{background:#1a7a3e;color:#fff;border:none;padding:10px 24px;border-radius:10px;font-family:'Sora',sans-serif;font-size:0.88rem;font-weight:600;cursor:pointer;transition:background 0.2s;white-space:nowrap;}
    .btn-s:hover{background:#27a854;}
    .hstats{display:flex;justify-content:center;gap:40px;flex-wrap:wrap;}
    .hst{text-align:center;}
    .hst-n{font-size:1.5rem;font-weight:700;color:#5dd98a;}
    .hst-l{font-size:0.75rem;color:rgba(255,255,255,0.4);margin-top:2px;}
    .page{max-width:1200px;margin:0 auto;padding:32px 24px 60px;display:grid;grid-template-columns:256px 1fr;gap:24px;align-items:start;}
    .fp{background:#fff;border-radius:16px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,0.05);position:sticky;top:80px;}
    .fp-head{font-size:0.95rem;font-weight:700;color:#1a1a2e;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid #f0ede8;}
    .fs{margin-bottom:18px;}
    .fl{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#bbb;margin-bottom:9px;}
    .fb{display:block;width:100%;text-align:left;padding:8px 12px;border:1.5px solid #ece8e0;border-radius:8px;background:#faf9f7;font-family:'Sora',sans-serif;font-size:0.82rem;color:#666;cursor:pointer;margin-bottom:5px;transition:all 0.15s;}
    .fb:hover,.fb.active{border-color:#27a854;background:#eef8f0;color:#1a1a2e;font-weight:600;}
    .pi{display:flex;gap:8px;align-items:center;}
    .pi input{flex:1;padding:8px 10px;border:1.5px solid #ece8e0;border-radius:8px;font-family:'Sora',sans-serif;font-size:0.82rem;color:#1a1a2e;background:#faf9f7;outline:none;}
    .pi input:focus{border-color:#27a854;}
    .pi span{color:#ccc;font-size:0.8rem;flex-shrink:0;}
    .bhkr{display:flex;flex-wrap:wrap;gap:6px;}
    .bb{padding:6px 11px;border:1.5px solid #ece8e0;border-radius:7px;background:#faf9f7;font-family:'Sora',sans-serif;font-size:0.79rem;color:#666;cursor:pointer;transition:all 0.15s;}
    .bb:hover,.bb.active{border-color:#27a854;background:#eef8f0;color:#1a1a2e;font-weight:600;}
    .furnish-row{display:flex;flex-direction:column;gap:5px;}
    .ba{width:100%;margin-top:10px;padding:10px;background:#1a7a3e;color:#fff;border:none;border-radius:8px;font-family:'Sora',sans-serif;font-size:0.85rem;font-weight:600;cursor:pointer;transition:background 0.2s;}
    .ba:hover{background:#27a854;}
    .bc{width:100%;margin-top:5px;padding:8px;background:transparent;color:#bbb;border:1px solid #ece8e0;border-radius:8px;font-family:'Sora',sans-serif;font-size:0.78rem;cursor:pointer;transition:all 0.2s;}
    .bc:hover{color:#e05656;border-color:#fcc;}
    .rh{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
    .rc{font-size:0.9rem;font-weight:600;color:#555;}
    .rc span{color:#27a854;}
    .sw{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .sw label{font-size:0.78rem;color:#aaa;}
    .sw select{padding:7px 12px;border:1.5px solid #ece8e0;border-radius:8px;font-family:'Sora',sans-serif;font-size:0.82rem;color:#666;background:#fff;outline:none;cursor:pointer;}
    .vbs{display:flex;gap:4px;}
    .vb{width:32px;height:32px;border:1.5px solid #ece8e0;border-radius:8px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.9rem;transition:all 0.15s;}
    .vb.active{background:#1a7a3e;border-color:#1a7a3e;color:#fff;}
    .pl{display:flex;flex-direction:column;gap:16px;}
    .ch{background:#fff;border-radius:16px;overflow:hidden;display:flex;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.05);transition:transform 0.2s,box-shadow 0.2s;}
    .ch:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.1);}
    .ci{width:210px;min-height:160px;background:linear-gradient(135deg,#0b3d2e,#1a7a3e);display:flex;align-items:center;justify-content:center;font-size:3rem;overflow:hidden;flex-shrink:0;position:relative;}
    .ci img{width:100%;height:100%;object-fit:cover;}
    .cbg{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:6px;font-size:0.72rem;font-weight:700;background:#eef8f0;color:#27a854;}
    .cb{padding:18px;flex:1;display:flex;flex-direction:column;justify-content:space-between;}
    .ct{font-size:0.97rem;font-weight:700;color:#1a1a2e;margin-bottom:4px;}
    .cl{font-size:0.78rem;color:#aaa;margin-bottom:12px;}
    .cs{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;}
    .sp{font-size:0.78rem;color:#666;display:flex;align-items:center;gap:4px;}
    .cf{display:flex;align-items:center;justify-content:space-between;}
    .cp{font-size:1.05rem;font-weight:700;color:#27a854;}
    .cp-sub{font-size:0.72rem;color:#bbb;margin-top:1px;}
    .cd{font-size:0.72rem;color:#ccc;}
    .bv{padding:8px 18px;background:#1a7a3e;color:#fff;border:none;border-radius:8px;font-family:'Sora',sans-serif;font-size:0.78rem;font-weight:600;cursor:pointer;transition:background 0.2s;}
    .bv:hover{background:#27a854;}
    .pg{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
    .empty{text-align:center;padding:60px 20px;background:#fff;border-radius:16px;}
    .empty h3{font-size:1.1rem;font-weight:700;margin-bottom:8px;color:#1a1a2e;}
    .empty p{font-size:0.85rem;color:#aaa;}
    .pag{display:flex;justify-content:center;gap:6px;margin-top:28px;flex-wrap:wrap;}
    .pb{min-width:36px;height:36px;padding:0 10px;border:1.5px solid #ece8e0;border-radius:8px;background:#fff;font-family:'Sora',sans-serif;font-size:0.82rem;font-weight:600;color:#666;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
    .pb.active{background:#1a7a3e;border-color:#1a7a3e;color:#fff;}
    .pb:hover:not(.active){border-color:#27a854;color:#27a854;}
    @media(max-width:900px){.page{grid-template-columns:1fr;}.fp{display:none;}.ci{width:140px;}}
    @media(max-width:600px){.hero{padding:40px 20px 32px;}.hero h1{font-size:1.7rem;}.page{padding:20px 16px 48px;}.pg{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-badge">🔑 Properties for Rent</div>
    <h1>Find Your <span>Perfect Rental</span></h1>
    <p>Browse verified rental properties across India — flats, PGs, houses and more</p>
    <div class="sbar">
      <input type="text" id="q" placeholder="🔍  City, locality or property name..." onkeydown="if(event.key==='Enter')doSearch()" />
      <select id="ft">
        <option value="">All Types</option>
        <option>Apartment</option>
        <option>Independent House</option>
        <option>Villa</option>
        <option>PG / Hostel</option>
      </select>
      <button class="btn-s" onclick="doSearch()">Search</button>
    </div>
    <div class="hstats">
      <div class="hst"><div class="hst-n" id="hs-total">—</div><div class="hst-l">For Rent</div></div>
      <div class="hst"><div class="hst-n" id="hs-cities">—</div><div class="hst-l">Cities</div></div>
      <div class="hst"><div class="hst-n" id="hs-pg">—</div><div class="hst-l">PG / Hostels</div></div>
    </div>
  </section>

  <div class="page">
    <aside class="fp">
      <div class="fp-head">🔧 Filters</div>
      <div class="fs">
        <div class="fl">Property Type</div>
        <button class="fb active" data-type="" onclick="setType(this)">All Types</button>
        <button class="fb" data-type="Apartment" onclick="setType(this)">🏢 Apartment</button>
        <button class="fb" data-type="Independent House" onclick="setType(this)">🏡 Independent House</button>
        <button class="fb" data-type="Villa" onclick="setType(this)">🏖️ Villa</button>
        <button class="fb" data-type="PG / Hostel" onclick="setType(this)">🛏️ PG / Hostel</button>
      </div>
      <div class="fs">
        <div class="fl">BHK</div>
        <div class="bhkr">
          <button class="bb" data-b="1 BHK" onclick="toggleBHK(this)">1 BHK</button>
          <button class="bb" data-b="2 BHK" onclick="toggleBHK(this)">2 BHK</button>
          <button class="bb" data-b="3 BHK" onclick="toggleBHK(this)">3 BHK</button>
          <button class="bb" data-b="Studio" onclick="toggleBHK(this)">Studio</button>
        </div>
      </div>
      <div class="fs">
        <div class="fl">Monthly Rent (₹)</div>
        <div class="pi">
          <input type="number" id="pmin" placeholder="Min" min="0"/>
          <span>—</span>
          <input type="number" id="pmax" placeholder="Max" min="0"/>
        </div>
        <button class="ba" onclick="render()">Apply</button>
        <button class="bc" onclick="clearAll()">Clear all filters</button>
      </div>
    </aside>

    <div>
      <div class="rh fade-up">
        <div class="rc" id="rc">Loading...</div>
        <div class="sw">
          <label>Sort</label>
          <select id="sort" onchange="render()">
            <option value="newest">Newest first</option>
            <option value="price-asc">Rent ↑</option>
            <option value="price-desc">Rent ↓</option>
          </select>
          <div class="vbs">
            <button class="vb active" id="vbl" onclick="setView('list')" title="List">☰</button>
            <button class="vb" id="vbg" onclick="setView('grid')" title="Grid">⊞</button>
          </div>
        </div>
      </div>
      <div id="results"></div>
      <div class="pag" id="pag"></div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script type="module">
    import { renderNav, renderFooter, skeletonCards, propCardHTML, fmtPrice, setMeta } from './nav.js';
    renderNav('rent'); renderFooter();
    setMeta({ title: 'Rent Property in India', description: 'Find verified rental properties across India. Apartments, houses, PGs and villas for rent.' });

    const PER = 8;
    let _all = [], _pg = 1, _view = 'list', _type = '', _bhks = [];

    window.setType   = btn => { document.querySelectorAll('[data-type]').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); _type=btn.dataset.type; _pg=1; render(); };
    window.toggleBHK = btn => { btn.classList.toggle('active'); _bhks=[...document.querySelectorAll('.bb.active')].map(b=>b.dataset.b); _pg=1; render(); };
    window.doSearch  = ()  => { _pg=1; render(); };
    window.setView   = v   => { _view=v; document.getElementById('vbl').classList.toggle('active',v==='list'); document.getElementById('vbg').classList.toggle('active',v==='grid'); render(); };
    window.goPage    = n   => { _pg=n; render(); window.scrollTo({top:0,behavior:'smooth'}); };
    window.clearAll  = ()  => { document.getElementById('q').value=''; document.getElementById('pmin').value=''; document.getElementById('pmax').value=''; document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type==='')); document.querySelectorAll('.bb').forEach(b=>b.classList.remove('active')); _type=''; _bhks=[]; _pg=1; render(); };

    const fmtDt = ts => { const d=Date.now()-ts; if(d<86400000)return'Today'; if(d<172800000)return'Yesterday'; return new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short'}); };

    function hCard(p) {
      const icon={Apartment:'🏢',Villa:'🏖️','PG / Hostel':'🛏️','Independent House':'🏡'}[p.type]||'🏠';
      return `<div class="ch fade-up" onclick="window.location.href='property.html?id=${p.id}'">
        <div class="ci">${p.photos?.[0]?`<img src="${p.photos[0]}" alt="${p.title}" loading="lazy"/>`:icon}<span class="cbg">For Rent</span></div>
        <div class="cb">
          <div><div class="ct">${p.title}</div><div class="cl">📍 ${[p.locality,p.city].filter(Boolean).join(', ')}</div>
          <div class="cs">${p.type?`<span class="sp">🏢 ${p.type}</span>`:''}${p.bhk?`<span class="sp">🛏️ ${p.bhk}</span>`:''}${p.area?`<span class="sp">📐 ${p.area} sq ft</span>`:''}</div></div>
          <div class="cf"><div><div class="cp">${fmtPrice(p.price)}<span style="font-size:0.75rem;color:#aaa;font-weight:400;"> /mo</span></div><div class="cd">${fmtDt(p.postedAt)}</div></div><button class="bv">View →</button></div>
        </div></div>`;
    }

    function render() {
      let props = _all.filter(p => p.listingType === 'Rent' || p.listingType === 'PG');
      const q = document.getElementById('q').value.trim().toLowerCase();
      const ft = document.getElementById('ft').value;
      if (q)  props = props.filter(p => p.title.toLowerCase().includes(q)||p.city.toLowerCase().includes(q)||(p.locality||'').toLowerCase().includes(q));
      const ftype = _type || ft;
      if (ftype) props = props.filter(p => p.type === ftype);
      if (_bhks.length) props = props.filter(p => _bhks.includes(p.bhk));
      const mn=parseFloat(document.getElementById('pmin').value), mx=parseFloat(document.getElementById('pmax').value);
      if (mn) props=props.filter(p=>p.price>=mn);
      if (mx) props=props.filter(p=>p.price<=mx);
      const s=document.getElementById('sort').value;
      if(s==='price-asc') props.sort((a,b)=>a.price-b.price);
      if(s==='price-desc') props.sort((a,b)=>b.price-a.price);
      if(s==='newest') props.sort((a,b)=>b.postedAt-a.postedAt);

      document.getElementById('rc').innerHTML=`<span>${props.length}</span> rental${props.length===1?'':'s'} found${q?` matching "<span>${q}</span>"`:''}`;

      const con=document.getElementById('results');
      if (!props.length) { con.innerHTML=`<div class="empty"><div style="font-size:3rem;margin-bottom:14px;">🔍</div><h3>No rentals found</h3><p>Try adjusting your filters</p></div>`; document.getElementById('pag').innerHTML=''; return; }

      const pages=Math.ceil(props.length/PER), paged=props.slice((_pg-1)*PER,_pg*PER);
      con.innerHTML = _view==='list' ? `<div class="pl">${paged.map(hCard).join('')}</div>` : `<div class="pg">${paged.map(propCardHTML).join('')}</div>`;

      if (pages<=1){document.getElementById('pag').innerHTML='';return;}
      let ph='';
      if(_pg>1) ph+=`<button class="pb" onclick="goPage(${_pg-1})">‹</button>`;
      for(let i=1;i<=pages;i++) ph+=`<button class="pb${i===_pg?' active':''}" onclick="goPage(${i})">${i}</button>`;
      if(_pg<pages) ph+=`<button class="pb" onclick="goPage(${_pg+1})">›</button>`;
      document.getElementById('pag').innerHTML=ph;
    }

    document.getElementById('results').innerHTML=`<div class="pl">${skeletonCards(4)}</div>`;

    NF.onReady(async () => {
      _all = await NF.getProperties();
      const rent = _all.filter(p => p.listingType==='Rent'||p.listingType==='PG');
      document.getElementById('hs-total').textContent  = rent.length;
      document.getElementById('hs-cities').textContent = [...new Set(rent.map(p=>p.city).filter(Boolean))].length;
      document.getElementById('hs-pg').textContent     = _all.filter(p=>p.listingType==='PG').length;
      const urlQ = new URLSearchParams(location.search).get('q');
      if (urlQ) document.getElementById('q').value = urlQ;
      render();
    });
  </script>
</body>
</html>
